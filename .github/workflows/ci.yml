name: ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdl3.c3l
      - name: install SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libasound2-dev libdrm-dev libgbm-dev libegl-dev \
            libgl-dev libudev-dev libdbus-1-dev
      - name: cache static SDL3
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: sdl3.c3l/sdl-build
          key: sdl3-static-release-3.4.16-linux-x64-${{ hashFiles('sdl3.c3l/.github/scripts/build-sdl-linux.sh') }}
      - name: build static SDL3
        run: bash sdl3.c3l/.github/scripts/build-sdl-linux.sh
      - name: install c3c 0.8.3
        run: |
          curl -L -o c3c.tar.gz https://github.com/c3lang/c3c/releases/download/v0.8.3/c3-linux.tar.gz
          tar xf c3c.tar.gz
          echo "$PWD/c3" >> "$GITHUB_PATH"
      - name: smoke compile (static-lib)
        run: |
          mkdir smoke && cd smoke
          cat > project.json <<'JSON'
          {
            "langrev": "1",
            "dependency-search-paths": [ ".." ],
            "dependencies": [ "sdl3" ],
            "sources": [ "main.c3" ],
            "targets": { "smoke": { "type": "static-lib" } }
          }
          JSON
          cat > main.c3 <<'C3'
          module smoke;
          import sdl;
          $assert sdl::Keymod::size == 2;
          $assert $reflect(sdl::KeyboardEvent.down).offset == 36;
          $assert $reflect(sdl::KeyboardEvent.repeat).offset == 37;
          fn void use() { sdl::InitFlags f = { .video = true }; sdl::Window* w; }
          fn sdl::Thread* start_thread(sdl::ThreadFunction callback, void* data)
          {
              return sdl::create_thread(callback, "smoke", data);
          }
          fn sdl::Thread* start_thread_with_properties(sdl::PropertiesID props)
          {
              return sdl::create_thread_with_properties(props);
          }
          C3
          c3c build smoke --warn-deprecation=error
          c3c compile -C main.c3 --libdir .. --lib sdl3 --target windows-x64 --warn-deprecation=error
